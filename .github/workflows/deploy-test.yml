name: Deploy Test

run-name: Deploy ${{ github.ref_name }} to test

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Also apply this branch's migrations to the shared test database"
        type: boolean
        default: false
  workflow_call:
    inputs:
      apply_migrations:
        type: boolean
        default: false

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Restore dependencies
        run: npm ci

      - name: Build for Cloudflare Workers (OpenNext)
        run: npx @opennextjs/cloudflare@latest build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}

      - name: Apply database migrations to TEST
        if: ${{ inputs.apply_migrations }}
        # Runners have no IPv6 and the direct db host is IPv6-only, so push through
        # the IPv4 Session pooler (port 5432) instead of link's direct connection.
        run: npx --yes supabase@2 db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy to Cloudflare Workers TEST
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env test
          wranglerVersion: "3"
          workingDirectory: apps/web
