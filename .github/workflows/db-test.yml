name: Database Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  db-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Applies every migration to an empty database, so a broken migration fails here
      # before it reaches a hosted project. Storage and auth stay on: migrations touch auth.users.
      - name: Start local Supabase
        run: npx --yes supabase@2 start -x studio,mailpit,imgproxy,edge-runtime,vector,logflare

      - name: Run pgTAP tests
        run: npx --yes supabase@2 test db
