name = "word-lock"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[triggers]
crons = ["*/30 * * * *"]

[env.test]
name = "word-lock-test"

[env.test.vars]
APP_HOSTNAME = "test.wordlock.cbsdev.me"

[env.production]
name = "word-lock"

[env.production.vars]
APP_HOSTNAME = "wordlock.cbsdev.me"
